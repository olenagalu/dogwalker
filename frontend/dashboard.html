<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My dashboard | Princess Dog Walker</title><link rel="stylesheet" href="css/styles.css"></head><body><a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="container nav"><a class="brand" href="index.html">Princess Dog Walker</a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open navigation">Menu</button><nav class="nav-links" id="nav-links"></nav></div></header>
  <main id="main"><section class="dashboard-hero"><div class="container"><span class="eyebrow">Customer dashboard</span><h1 id="dashboard-greeting">Welcome back.</h1><p>Manage your dogs, profile, and bookings in one place.</p><a class="button button-clay" href="book.html">Book a service</a></div></section><section class="section-sm"><div class="container dashboard-layout"><nav class="dashboard-nav"><a href="#bookings">Bookings</a><a href="#dogs">My dogs</a><a href="#profile">Profile</a></nav><div class="dashboard-content"><div class="form-status" id="dashboard-status" role="status"></div>
    <section class="dashboard-section" id="bookings"><div class="section-heading"><div><span class="eyebrow">Your schedule</span><h2>Bookings</h2></div></div><h3>Upcoming</h3><div class="appointments" id="upcoming-bookings"><div class="empty-state">Loading…</div></div><h3 style="margin-top:2rem">Previous</h3><div class="appointments" id="previous-bookings"></div></section>
    <section class="dashboard-section" id="dogs"><div class="section-heading"><div><span class="eyebrow">Saved companions</span><h2>My dogs</h2></div></div><div class="profile-grid"><div id="dog-list" class="mini-card-list"></div><form class="panel-form" id="dog-form"><input type="hidden" id="dog-id"><h3 id="dog-form-title">Add a dog</h3><div class="form-grid"><div class="field"><label for="dog-name">Name</label><input id="dog-name" name="name" maxlength="80" required></div><div class="field"><label for="dog-breed">Breed</label><input id="dog-breed" name="breed" maxlength="80"></div><div class="field"><label for="dog-age">Age</label><input type="number" id="dog-age" name="age" min="0" max="30"></div><div class="field field-full"><label for="dog-care">Care instructions</label><textarea id="dog-care" name="careInstructions" maxlength="2000"></textarea></div><div class="field"><label for="dog-behavior">Behavioral notes</label><textarea id="dog-behavior" name="behavioralNotes" maxlength="1500"></textarea></div><div class="field"><label for="dog-medical">Medical / allergy information</label><textarea id="dog-medical" name="medicalNotes" maxlength="1500"></textarea></div></div><button class="button" type="submit">Save dog</button> <button class="link-button" id="clear-dog-form" type="button">Clear</button></form></div></section>
    <section class="dashboard-section" id="profile"><div class="section-heading"><div><span class="eyebrow">Account details</span><h2>Profile</h2></div></div><form class="panel-form narrow" id="profile-form"><div class="field"><label for="profile-name">Full name</label><input id="profile-name" name="fullName" required></div><div class="field"><label for="profile-email">Email</label><input type="email" id="profile-email" disabled></div><div class="field"><label for="profile-phone">Phone</label><input type="tel" id="profile-phone" name="phone" required></div><button class="button" type="submit">Save profile</button></form></section>
  </div></div></section></main><script src="js/api.js"></script><script src="js/main.js"></script><script src="js/dashboard.js"></script>
</body></html>
