<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency care request</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="container section"><a href="availability.html">Back to Availability</a><h1>Request emergency care</h1><p id="emergency-hours"></p><p>This request needs Julia’s approval. It does not reserve a booking or charge your card.</p><form id="emergency-form" class="panel-form">
<label>Your name<input name="name" required maxlength="120"></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required maxlength="30"></label><label>Service address<input name="address" required maxlength="300"></label><label>Dog’s name<input name="dog" required maxlength="80"></label><label>Breed<input name="breed" maxlength="80"></label><label>Service<select name="serviceId" required></select></label><label>Date<input type="date" name="date" required></label><label>Requested time<input type="time" name="time" required></label><label>Care notes<textarea name="notes" maxlength="1000"></textarea></label><button class="button">Send emergency request</button><p id="emergency-status" role="status"></p></form></main><script src="js/api.js"></script><script src="js/emergency.js"></script></body></html>
