services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pawsandpaths
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pawsandpaths-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawsandpaths"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/PawsAndPaths.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=pawsandpaths;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Owner__Email: ${OWNER_EMAIL}
      Owner__Password: ${OWNER_PASSWORD}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      ApplyMigrationsOnStartup: "true"
      AllowedOrigins__0: http://localhost:5500
    ports:
      - "5095:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5500:80"
    depends_on:
      - api

volumes:
  pawsandpaths-data:
